services:
  catalog:
    build:
      context: ..
      dockerfile: docker/lesson.Dockerfile
    command: ["node", "lessons/01-service-boundaries-http/catalog.mts"]
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - "127.0.0.1:${CATALOG_PORT:-3101}:3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
  orders:
    build:
      context: ..
      dockerfile: docker/lesson.Dockerfile
    command: ["node", "lessons/01-service-boundaries-http/orders.mts"]
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      CATALOG_URL: http://catalog:3000
    ports:
      - "127.0.0.1:${ORDERS_PORT:-3102}:3000"
    depends_on:
      catalog:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
