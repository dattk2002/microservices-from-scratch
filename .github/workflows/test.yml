name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install process-isolation dependency
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y bubblewrap
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Controller guards and strict isolated HTTP tests
        run: make test
      - name: Validate Compose configuration
        run: docker compose -f compose/01-service-boundaries.yaml config --quiet
